# piCoreCDSP v2 — pcm.picorecdsp ALSA plug definition (roadmap §6)
#
# This file is written verbatim to /etc/asound.conf by install_picorecdsp.sh.
# It defines the single shared ingress PCM that every ALSA producer (Squeezelite,
# AirPlay, MPD, …) targets.  The slave is the snd-aloop capture side; CamillaDSP
# reads from the playback side of the same loopback device.
#
# Contract invariants (enforced by src/source/alsa_loopback.rs):
#   format    = S32_LE      (producers must honour or auto-convert via plug)
#   channels  = 2           (stereo only)
#   rate      = unchanged   (no plug-level resampling; rate negotiated end-to-end)
#
# Loopback device numbering on a typical pCP setup:
#   Loopback,0 = capture side seen by producers (written to by producers)
#   Loopback,1 = playback side seen by CamillaDSP (read by CamillaDSP)
#   subdevice 0 = first (and only) subdevice used by piCoreCDSP
#
# DO NOT change the format, channels, or rate fields here without updating
# src/source/alsa_loopback.rs (CANONICAL_ASOUND_CONF) and re-running the
# contract validation tests.

pcm.picorecdsp {
    type plug
    slave {
        pcm "hw:Loopback,1,0"
        format S32_LE
        channels 2
        rate unchanged
    }
}
