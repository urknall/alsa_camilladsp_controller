# piCoreCDSP v2 — pcm.picorecdsp ALSA plug definition (roadmap §6)
#
# This file is written verbatim to /etc/asound.conf by install_picorecdsp.sh.
# It defines the single shared ingress PCM that every ALSA producer (Squeezelite,
# AirPlay, MPD, …) targets.
#
# In the snd-aloop wiring used by piCoreCDSP:
#   • Producers open pcm.picorecdsp for playback.  The plug routes their output
#     to hw:Loopback,1,0 (the playback side of snd-aloop device 1).
#   • snd-aloop's loopback connection makes that audio readable on the capture
#     side of device 0 (hw:Loopback,0,0), which is what CamillaDSP captures from.
#
# CANONICAL definition source: src/source/alsa_loopback.rs (CANONICAL_ASOUND_CONF).
# The slave PCM here must remain identical to that constant.  If it changes,
# update both files and re-run the contract validation tests.
#
# Contract invariants (enforced by src/source/alsa_loopback.rs):
#   format    = S32_LE      (producers must honour or auto-convert via plug)
#   channels  = 2           (stereo only)
#   rate      = unchanged   (no plug-level resampling; rate negotiated end-to-end)
#
# Verify the loopback device side (device 0 vs 1) on real hardware at Gate 12.
# DO NOT change the format, channels, or rate fields without updating
# CANONICAL_ASOUND_CONF and re-running the contract validation tests.

pcm.picorecdsp {
    type plug
    slave {
        pcm "hw:Loopback,1,0"
        format S32_LE
        channels 2
        rate unchanged
    }
}
