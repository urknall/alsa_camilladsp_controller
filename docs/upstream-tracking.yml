# Upstream tracking manifest (Phase 5 / Phase 19 / Phase 20 / Phase 20a-c)
#
# Machine-readable companion to the human-readable docs in this directory
# (and picoredsp-ioplug/docs/BLUEALSA_TRACKING.md). Consumed by
# .github/workflows/upstream-tracking.yml, which compares each entry's
# `last_reviewed_commit` against the latest upstream commit touching
# `tracked_paths` and opens a GitHub issue (with `label`) when they differ.
#
# The same check also verifies that every entry's `tracked_paths` still
# exist upstream (at the repository's default branch HEAD) and opens a
# separate "tracking stale" issue when one is missing. This closes the gap
# that let the BlueALSA entry go stale silently: its tracked path had moved
# from `src/bluealsa-pcm.c` to `src/asound/bluealsa-pcm.c` upstream, so the
# commit-diff check alone kept reporting "no changes" against a path that no
# longer existed instead of surfacing the rename.
#
# IMPORTANT: this manifest only drives *issue creation* for manual review.
# Nothing in this repository automatically merges, cherry-picks, or applies
# upstream changes based on this file.
#
# Fields:
#   id                   short identifier, used to build idempotent issue titles
#   repository            "owner/repo" on GitHub
#   tracked_paths         paths (files or directories) whose changes matter;
#                         empty list means "track the whole repository"
#   last_reviewed_commit  full SHA of the last commit reviewed for this entry
#   last_reviewed_tag     optional human-friendly release tag, if applicable
#   review_date           ISO 8601 date of the last review
#   label                 GitHub issue label to apply (created if missing)
#   priority              HIGH | MEDIUM | LOW (see docs/ALSA_LIB_TRACKING.md)
#   doc                   path to the human-readable tracking document

