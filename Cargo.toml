[package]
name = "picoredsp-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.71"
description = "ALSA snd-aloop to CamillaDSP controller for piCorePlayer"
license = "MIT"
repository = "https://github.com/urknall/alsa_camilladsp_controller"

[[bin]]
name = "picoredsp-controller"
path = "src/main.rs"

[dependencies]
alsa = "=0.11.0"
serde_json = "=1.0.145"
serde_yaml_ng = "=0.10.0"
tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
