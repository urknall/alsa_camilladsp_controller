[package]
name = "picorecdsp"
version = "0.1.0"
edition = "2021"
description = "piCoreCDSP v2 — CamillaDSP-native controller (see piCoreCDSP_v2_Roadmap.md)"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
serde_json = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

[lib]
name = "picorecdsp"
path = "src/lib.rs"

[[bin]]
name = "picorecdsp"
path = "src/main.rs"
