[package]
name = "picoredsp-controller"
version = "0.2.0"
edition = "2021"
rust-version = "1.71"
description = "Dual-backend (ALSA snd-aloop and native ioplug) CamillaDSP controller for piCorePlayer"
license = "MIT"
repository = "https://github.com/urknall/alsa_camilladsp_controller"

[[bin]]
name = "picoredsp-controller"
path = "src/main.rs"

[[bench]]
name = "picoredsp_bench"
path = "benches/picoredsp_bench.rs"
harness = false

[dependencies]
alsa = "=0.9.1"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.145"
serde_yaml_ng = "=0.10.0"
tungstenite = { version = "=0.26.0", default-features = false, features = ["handshake"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
