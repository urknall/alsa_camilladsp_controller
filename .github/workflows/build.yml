name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'install_picoredsp.sh'
      - 'picoredsp-ioplug/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'install_picoredsp.sh'
      - 'picoredsp-ioplug/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  # ─── Formatting check ────────────────────────────────────────────────────
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable) with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  # ─── Clippy lint ─────────────────────────────────────────────────────────
  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable) with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install ALSA development headers
        run: sudo apt-get install -y libasound2-dev

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  # ─── MSRV check ──────────────────────────────────────────────────────────
  msrv:
    name: MSRV (1.71)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust 1.71 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.71

      - name: Install ALSA development headers
        run: sudo apt-get install -y libasound2-dev

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msrv-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: Check that code compiles on MSRV
        run: cargo check --locked

  # ─── Unit tests run on the host (x86-64) ─────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA development headers
        run: sudo apt-get install -y libasound2-dev

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run unit tests
        run: cargo test --locked

  # ─── CamillaDSP live compatibility (pinned release) ──────────────────────
  #
  # Runs the #[ignore]-gated live-CamillaDSP tests (Rust `--check` config
  # validation + real WebSocket queries) against the exact CamillaDSP binary
  # this project pins in install_picoredsp.sh. These tests exercise the
  # actual upstream binary rather than mocks, so they catch config-schema or
  # WebSocket-API drift that unit tests alone cannot (see
  # `docs/CAMILLADSP_TRACKING.md`). This job is blocking: a pinned-version
  # regression must fail CI.
  camilladsp_compat_pinned:
    name: CamillaDSP live compat (pinned)
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA development headers
        run: sudo apt-get install -y libasound2-dev

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cdsp-compat-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cdsp-compat-

      - name: Download pinned CamillaDSP release
        run: |
          set -euo pipefail
          cdsp_version=$(grep -m1 '^CDSP_VERSION=' install_picoredsp.sh | cut -d'"' -f2)
          echo "Pinned CamillaDSP version: ${cdsp_version}"
          mkdir -p /tmp/camilladsp
          curl -fsSL -o /tmp/camilladsp/camilladsp.tar.gz \
            "https://github.com/HEnquist/camilladsp/releases/download/${cdsp_version}/camilladsp-linux-amd64.tar.gz"
          tar -xzf /tmp/camilladsp/camilladsp.tar.gz -C /tmp/camilladsp
          chmod +x /tmp/camilladsp/camilladsp
          /tmp/camilladsp/camilladsp --version

      - name: Run live CamillaDSP compatibility tests
        env:
          PICOREDSP_TEST_CAMILLADSP_BIN: /tmp/camilladsp/camilladsp
        run: cargo test --locked -- --ignored --test-threads=1

  # ─── CamillaDSP live compatibility (latest upstream release) ────────────
  #
  # Same tests, but against whatever CamillaDSP currently publishes as
  # "latest" — not the pinned version. This is a non-blocking early-warning
  # signal for upstream API/schema drift ahead of intentionally bumping
  # CDSP_VERSION; see docs/CAMILLADSP_TRACKING.md and Phase 20a of
  # ROADMAP_CHECKLIST.md. Never gates the build.
  camilladsp_compat_latest:
    name: CamillaDSP live compat (latest upstream, non-blocking)
    runs-on: ubuntu-24.04
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA development headers
        run: sudo apt-get install -y libasound2-dev

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cdsp-compat-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cdsp-compat-

      - name: Download latest CamillaDSP release
        run: |
          set -euo pipefail
          latest_tag=$(curl -fsSL https://api.github.com/repos/HEnquist/camilladsp/releases/latest \
            | grep -m1 '"tag_name"' | cut -d'"' -f4)
          echo "Latest upstream CamillaDSP version: ${latest_tag}"
          mkdir -p /tmp/camilladsp-latest
          curl -fsSL -o /tmp/camilladsp-latest/camilladsp.tar.gz \
            "https://github.com/HEnquist/camilladsp/releases/download/${latest_tag}/camilladsp-linux-amd64.tar.gz"
          tar -xzf /tmp/camilladsp-latest/camilladsp.tar.gz -C /tmp/camilladsp-latest
          chmod +x /tmp/camilladsp-latest/camilladsp
          /tmp/camilladsp-latest/camilladsp --version

      - name: Run live CamillaDSP compatibility tests (latest)
        env:
          PICOREDSP_TEST_CAMILLADSP_BIN: /tmp/camilladsp-latest/camilladsp
        run: cargo test --locked -- --ignored --test-threads=1

  # ─── Installer shell syntax checks ────────────────────────────────────────
  installer_shell_syntax:
    name: Installer shell syntax
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Validate installer script syntax (sh and dash)
        run: |
          sh -n install_picoredsp.sh
          dash -n install_picoredsp.sh

  # ─── Rust microbenchmarks ─────────────────────────────────────────────────
  rust_bench:
    name: Rust benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install ALSA development headers
        run: sudo apt-get install -y libasound2-dev

      - name: Cache Cargo registry and build artefacts
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-bench-

      - name: Build and run Rust benchmark suite
        run: cargo bench --locked 2>&1 | tee /tmp/rust_bench.txt

      - name: Generate benchmark coverage report
        run: |
          cargo run --locked -- --make-benchmark-plan --output /tmp/benchmark-plan.yml
          cargo run --locked -- --make-benchmark-report /tmp/benchmark-plan.yml --output /tmp/benchmark-report.md

      - name: Write benchmark results to job summary
        if: always()
        run: |
          echo '## Rust benchmark results' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/rust_bench.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo '## Benchmark coverage report' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/benchmark-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Rust benchmark artefacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rust-bench-results
          path: |
            /tmp/rust_bench.txt
            /tmp/benchmark-plan.yml
            /tmp/benchmark-report.md
          if-no-files-found: warn

  # ─── C ioplug microbenchmarks ─────────────────────────────────────────────
  ioplug_bench:
    name: ioplug benchmarks
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libasound2-dev

      - name: Configure (Release, BENCH=ON)
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_bench \
            -DCMAKE_BUILD_TYPE=Release \
            -DBENCH=ON

      - name: Build benchmark executables
        run: cmake --build picoredsp-ioplug/build_bench --target bench_ringbuffer bench_timing bench_pcm_worker

      - name: Run bench_ringbuffer
        run: picoredsp-ioplug/build_bench/bench_ringbuffer 2>&1 | tee /tmp/bench_ringbuffer.txt

      - name: Run bench_timing
        run: picoredsp-ioplug/build_bench/bench_timing 2>&1 | tee /tmp/bench_timing.txt

      - name: Run bench_pcm_worker
        run: picoredsp-ioplug/build_bench/bench_pcm_worker 2>&1 | tee /tmp/bench_pcm_worker.txt

      - name: Write benchmark results to job summary
        if: always()
        run: |
          echo '## ioplug benchmark results' >> "$GITHUB_STEP_SUMMARY"
          for f in /tmp/bench_ringbuffer.txt /tmp/bench_timing.txt /tmp/bench_pcm_worker.txt; do
            [ -f "$f" ] || continue
            echo "### $(basename "$f" .txt)" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat "$f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Upload benchmark results as artefact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ioplug-bench-results
          path: |
            /tmp/bench_ringbuffer.txt
            /tmp/bench_timing.txt
            /tmp/bench_pcm_worker.txt
          if-no-files-found: warn

  native_c_tests:
    name: Native C tests (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libasound2-dev clang

      - name: Configure native test build
        env:
          CC: ${{ matrix.compiler }}
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_${{ matrix.compiler }} \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build native test binaries
        run: cmake --build picoredsp-ioplug/build_${{ matrix.compiler }} --parallel

      - name: Run CTest suite
        run: ctest --test-dir picoredsp-ioplug/build_${{ matrix.compiler }} --output-on-failure

  # ─── AddressSanitiser run ──────────────────────────────────────────────────
  asan:
    name: ASAN
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libasound2-dev clang

      - name: Configure (Debug, ASAN=ON)
        env:
          CC: clang
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_asan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASAN=ON

      - name: Build
        run: cmake --build picoredsp-ioplug/build_asan --parallel

      - name: Run CTest suite under ASAN
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:halt_on_error=1
        run: ctest --test-dir picoredsp-ioplug/build_asan --output-on-failure

  # ─── UndefinedBehaviourSanitiser run ──────────────────────────────────────
  ubsan:
    name: UBSAN
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libasound2-dev clang

      - name: Configure (Debug, UBSAN=ON)
        env:
          CC: clang
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_ubsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DUBSAN=ON

      - name: Build
        run: cmake --build picoredsp-ioplug/build_ubsan --parallel

      - name: Run CTest suite under UBSAN
        env:
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir picoredsp-ioplug/build_ubsan --output-on-failure

  # ─── ThreadSanitiser run ───────────────────────────────────────────────────
  tsan:
    name: TSAN
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libasound2-dev clang

      - name: Configure (Debug, TSAN=ON)
        env:
          CC: clang
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_tsan \
            -DCMAKE_BUILD_TYPE=Debug \
            -DTSAN=ON

      - name: Build
        run: cmake --build picoredsp-ioplug/build_tsan --parallel

      - name: Run CTest suite under TSAN
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir picoredsp-ioplug/build_tsan --output-on-failure

  # ─── clang-tidy static analysis ───────────────────────────────────────────
  clang_tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: sudo apt-get install -y cmake libasound2-dev clang clang-tidy

      - name: Configure (Debug, CLANG_TIDY=ON)
        env:
          CC: clang
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_tidy \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCLANG_TIDY=ON

      - name: Build (clang-tidy runs during compilation)
        run: cmake --build picoredsp-ioplug/build_tidy --parallel

  # ─── Cross-compile release binaries ──────────────────────────────────────
  build:
    name: Build (${{ matrix.binary_suffix }})
    runs-on: ubuntu-24.04
    needs: [fmt, clippy, msrv, test, camilladsp_compat_pinned, installer_shell_syntax, native_c_tests, asan, ubsan, tsan, clang_tidy]
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # 64-bit ARM — Raspberry Pi 3/4/5 running 64-bit piCorePlayer
          - target: aarch64-unknown-linux-gnu
            binary_suffix: aarch64
            cross_gcc: gcc-aarch64-linux-gnu
            cmake_cc: aarch64-linux-gnu-gcc
            libasound_arch: arm64
            pkg_config_path: /usr/lib/aarch64-linux-gnu/pkgconfig

          # 32-bit ARMv7 — Raspberry Pi 2/3 running 32-bit piCorePlayer
          - target: armv7-unknown-linux-gnueabihf
            binary_suffix: armv7
            cross_gcc: gcc-arm-linux-gnueabihf
            cmake_cc: arm-linux-gnueabihf-gcc
            libasound_arch: armhf
            pkg_config_path: /usr/lib/arm-linux-gnueabihf/pkgconfig

    steps:
      - name: Ensure CA certificates are installed
        run: sudo apt-get install -y ca-certificates && sudo update-ca-certificates

      - uses: actions/checkout@v5

      - name: Install Rust (stable) with cross-compilation target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Enable multiarch and install cross toolchain + ALSA headers
        run: |
          sudo dpkg --add-architecture ${{ matrix.libasound_arch }}
          # On Ubuntu 24.04 (Noble), apt sources use the new DEB822 format
          # (/etc/apt/sources.list.d/ubuntu.sources).  After adding a foreign
          # arch, apt tries to fetch that arch's packages from the standard
          # archive, which returns 404 for arm64/armhf on noble.
          # Fix: restrict the existing DEB822 source to amd64 only, then add
          # a classic-format source for ports.ubuntu.com for the cross arch.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            grep -q '^Architectures:' /etc/apt/sources.list.d/ubuntu.sources || \
              sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          else
            sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          fi
          printf 'deb [arch=%s] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse\n' \
            "${{ matrix.libasound_arch }}" | sudo tee /etc/apt/sources.list.d/cross-ports.list
          printf 'deb [arch=%s] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse\n' \
            "${{ matrix.libasound_arch }}" | sudo tee -a /etc/apt/sources.list.d/cross-ports.list
          printf 'deb [arch=%s] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse\n' \
            "${{ matrix.libasound_arch }}" | sudo tee -a /etc/apt/sources.list.d/cross-ports.list
          sudo apt-get update -qq
          sudo apt-get install -y \
            cmake \
            pkg-config \
            ${{ matrix.cross_gcc }} \
            libasound2-dev:${{ matrix.libasound_arch }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build ioplug release module
        env:
          CC: ${{ matrix.cmake_cc }}
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: ${{ matrix.pkg_config_path }}
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_${{ matrix.binary_suffix }} \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build picoredsp-ioplug/build_${{ matrix.binary_suffix }} \
            --target asound_module_pcm_picoredsp

      - name: Stage binary with architecture suffix
        run: |
          cp target/${{ matrix.target }}/release/picoredsp-controller \
             picoredsp-controller-${{ matrix.binary_suffix }}
          cp picoredsp-ioplug/build_${{ matrix.binary_suffix }}/libasound_module_pcm_picoredsp.so \
             libasound_module_pcm_picoredsp-${{ matrix.binary_suffix }}.so

      - name: Generate SHA256 checksum
        run: |
          sha256sum picoredsp-controller-${{ matrix.binary_suffix }} \
            > picoredsp-controller-${{ matrix.binary_suffix }}.sha256
          sha256sum libasound_module_pcm_picoredsp-${{ matrix.binary_suffix }}.so \
            > libasound_module_pcm_picoredsp-${{ matrix.binary_suffix }}.so.sha256

      - name: Upload build artefact
        uses: actions/upload-artifact@v6
        with:
          name: picoredsp-controller-${{ matrix.binary_suffix }}
          path: |
            picoredsp-controller-${{ matrix.binary_suffix }}
            picoredsp-controller-${{ matrix.binary_suffix }}.sha256
            libasound_module_pcm_picoredsp-${{ matrix.binary_suffix }}.so
            libasound_module_pcm_picoredsp-${{ matrix.binary_suffix }}.so.sha256
          if-no-files-found: error

  # ─── Publish a rolling release for the installer on main ──────────────────
  release_main:
    name: Publish installer release
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Download aarch64 binary
        uses: actions/download-artifact@v7
        with:
          name: picoredsp-controller-aarch64

      - name: Download armv7 binary
        uses: actions/download-artifact@v7
        with:
          name: picoredsp-controller-armv7

      - name: Delete existing installer-latest tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete installer-latest --yes --cleanup-tag 2>/dev/null || true

      - name: Create or update rolling installer release
        uses: softprops/action-gh-release@v3
        env:
          NODE_OPTIONS: --use-system-ca
        with:
          tag_name: installer-latest
          target_commitish: ${{ github.sha }}
          name: Installer latest
          body: |
            Rolling release for installer downloads from the latest successful main branch build.
          prerelease: true
          files: |
            picoredsp-controller-aarch64
            picoredsp-controller-aarch64.sha256
            picoredsp-controller-armv7
            picoredsp-controller-armv7.sha256
            libasound_module_pcm_picoredsp-aarch64.so
            libasound_module_pcm_picoredsp-aarch64.so.sha256
            libasound_module_pcm_picoredsp-armv7.so
            libasound_module_pcm_picoredsp-armv7.so.sha256
          fail_on_unmatched_files: true

  # ─── Create immutable GitHub releases on version tags ─────────────────────
  release_tag:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME}"
          CARGO_VERSION="v$(grep '^version' Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
          if [ "${TAG}" != "${CARGO_VERSION}" ]; then
            echo "ERROR: Git tag '${TAG}' does not match Cargo.toml version '${CARGO_VERSION}'."
            echo "Update Cargo.toml before pushing a release tag."
            exit 1
          fi
          echo "Tag ${TAG} matches Cargo.toml version — OK."

      - name: Download aarch64 binary
        uses: actions/download-artifact@v7
        with:
          name: picoredsp-controller-aarch64

      - name: Download armv7 binary
        uses: actions/download-artifact@v7
        with:
          name: picoredsp-controller-armv7

      - name: Create release and attach binaries
        uses: softprops/action-gh-release@v3
        env:
