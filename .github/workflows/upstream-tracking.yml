name: Upstream Tracking

# Phase 5 / Phase 19 / Phase 20 / Phase 20a-c: monitor reference and runtime
# upstream dependencies (BlueALSA, alsa-lib, CamillaDSP, camilladsp-controller,
# camillagui) for changes to tracked files, and open a GitHub issue for
# manual review. This workflow NEVER merges, cherry-picks, or otherwise
# applies upstream changes automatically - see docs/upstream-tracking.yml.

on:
  schedule:
    # Weekly, Monday 06:00 UTC.
    - cron: '0 6 * * 1'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docs/upstream-tracking.yml'
      - 'scripts/check_upstream_tracking.py'
      - 'scripts/test_check_upstream_tracking.py'
      - '.github/workflows/upstream-tracking.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/upstream-tracking.yml'
      - 'scripts/check_upstream_tracking.py'
      - 'scripts/test_check_upstream_tracking.py'
      - '.github/workflows/upstream-tracking.yml'

jobs:
  check:
    name: Check tracked upstream sources
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    outputs:
      alsa_lib_release_detected: ${{ steps.check.outputs.alsa_lib_release_detected }}
      alsa_lib_release_tag: ${{ steps.check.outputs.alsa_lib_release_tag }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Validate manifest syntax
        run: python3 -c "import yaml; yaml.safe_load(open('docs/upstream-tracking.yml'))"

      - name: Run tracking script unit tests
        run: python3 -m unittest test_check_upstream_tracking -v
        working-directory: scripts

      # Pull requests only validate the manifest/script; they must not open
      # issues (no token with issue-write scope is used, and --dry-run is
      # forced) so a PR touching this workflow cannot spam the tracker.
      - name: Check for upstream changes (dry run on pull_request)
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_upstream_tracking.py --repo "${{ github.repository }}" --dry-run

      - name: Check for upstream changes
        if: github.event_name != 'pull_request'
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/check_upstream_tracking.py --repo "${{ github.repository }}"

  # New alsa-lib release detected above -> actually build alsa-lib at that
  # tag and run the native ioplug test suite against it, instead of only
  # opening a tracking issue that requires a human to remember to do this.
  test_against_new_alsa_lib_release:
    name: Build & test against newly released alsa-lib
    needs: check
    if: needs.check.outputs.alsa_lib_release_detected == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            gettext cmake

      - name: Build and install alsa-lib ${{ needs.check.outputs.alsa_lib_release_tag }} from source
        run: |
          git clone --branch "${{ needs.check.outputs.alsa_lib_release_tag }}" \
            --depth 1 https://github.com/alsa-project/alsa-lib.git /tmp/alsa-lib
          cd /tmp/alsa-lib
          libtoolize --force --copy --automake
          aclocal
          autoheader
          automake --foreign --copy --add-missing
          autoconf
          ./configure --prefix=/usr
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig

      - name: Configure native test build against the new alsa-lib release
        run: |
          cmake -S picoredsp-ioplug -B picoredsp-ioplug/build_new_alsa_lib \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build native test binaries
        run: cmake --build picoredsp-ioplug/build_new_alsa_lib --parallel

      - name: Run CTest suite against the new alsa-lib release
        run: ctest --test-dir picoredsp-ioplug/build_new_alsa_lib --output-on-failure
